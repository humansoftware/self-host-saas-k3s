---
buildkit_namespace: buildkit
buildkit_image: moby/buildkit:v0.26.3
buildkit_listen_addr: tcp://0.0.0.0:1234
buildkit_service_port: 1234
buildkit_registry_host: "{{ harbor_domain }}"

# Projects whose GitHub Actions runners build images through this BuildKit. Only
# these get the buildkit-runner Role, which grants pods/exec in the buildkit
# namespace. Verified against the BuildKit build history: it contains
# postward-cloud workflow runs and no entries for the other projects. Keep this
# list explicit rather than granting every project, and add a project here only
# once it actually builds.
buildkit_projects:
  - postward

# The buildkitd cache lives on an emptyDir, which has no size limit of its own.
# Without an ephemeral-storage request the scheduler cannot account for the
# cache and the kubelet evicts this pod first when node storage runs low
# (observed: "The node was low on resource: ephemeral-storage", which left
# buildkitd failing on a stale buildkitd.lock). The limit is sized above
# buildkitd's own GC maxUsedSpace (12GB) so the cache is trimmed by buildkit's
# GC before the kubelet has to intervene.
buildkit_ephemeral_storage_request: 5Gi
buildkit_ephemeral_storage_limit: 16Gi
buildkit_memory_request: 2Gi
buildkit_memory_limit: 6Gi
