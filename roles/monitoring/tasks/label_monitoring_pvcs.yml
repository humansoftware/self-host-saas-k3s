---
- name: Gather PVCs in monitoring namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ monitoring_namespace }}"
  register: monitoring_pvcs

- name: Assign monitoring PVCs to a cleanup-only Longhorn recurring group
  # Longhorn syncs PVC recurring-job labels to the associated Volume when the
  # PVC is marked as a recurring-job source. Therefore we:
  # 1) ensure the source label is present,
  # 2) assign the cleanup-only monitoring group, and
  # 3) remove the default group that runs the weekly backup.
  when: >-
    (monitoring_pvcs.resources | length > 0)
    and (label_monitoring_pvcs_skip_backup | default(true))
  include_tasks: label_monitoring_pvc_item.yml
  loop: "{{ monitoring_pvcs.resources }}"
  loop_control:
    label: "{{ pvc.metadata.name }}"
    loop_var: pvc
