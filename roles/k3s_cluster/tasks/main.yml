# This ansible will set up a K3s cluster with server and agent nodes,
# ensuring prerequisites are met and configurations are applied.
# As output, a fact `k3s_kubeconfig_path` will be set to the local kubeconfig file path.
# You must ensure the required secrets are set before running this playbook.
- name: Fail if K3S_TOKEN is not set
  ansible.builtin.fail:
    msg: "The environment variable K3S_TOKEN must be set before running this playbook."
  when: k3s_token is not defined or k3s_token == ""

- name: Fail if K3S_LOCAL_KUBECONFIG is not set
  ansible.builtin.fail:
    msg: "The environment variable K3S_LOCAL_KUBECONFIG must be set before running this playbook."
  when: k3s_local_kubeconfig is not defined or k3s_local_kubeconfig == ""

- name: Set the needed secrets facts for all hosts
  ansible.builtin.set_fact:
    token: "{{ k3s_token }}"

# Ensure inotify max_user_watches is set
- name: Ensure inotify max_user_watches is set
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: '524288'
    state: present
    reload: true
  when: "'k3s_cluster' in group_names"

- name: Ensure inotify max_user_instances is set
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: '8192'
    state: present
    reload: true
  when: "'k3s_cluster' in group_names"

# Common prerequisites for all k3s_cluster hosts
- name: Run prereq role on all k3s_cluster hosts
  ansible.builtin.include_role:
    name: k3s.orchestration.prereq
  when: "'k3s_cluster' in group_names"

# Setup server nodes
- name: Setup K3s Server
  ansible.builtin.include_role:
    name: k3s.orchestration.k3s_server
  when: "'server' in group_names"

# Copy kubeconfig to local machine and set kubeconfig path fact
- name: Fetch kubeconfig to control node
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_local_kubeconfig }}"
    flat: true
  when: "'server' in group_names"

- name: Set kubeconfig path fact
  ansible.builtin.set_fact:
    k3s_kubeconfig_path: "{{ k3s_local_kubeconfig }}"
  when: "'server' in group_names"



# Setup agent nodes
- name: Ensure k3s-agent.service.env exists
  ansible.builtin.file:
    path: "{{ systemd_dir }}/k3s-agent.service.env"
    state: touch
    owner: root
    group: root
    mode: "0644"
  vars:
    systemd_dir: "/etc/systemd/system"
  when: "'agent' in group_names"

- name: Setup K3s Agent
  ansible.builtin.include_role:
    name: k3s.orchestration.k3s_agent
  when: "'agent' in group_names"

# The upstream k3s_agent role rewrites ExecStart with a regexp that only matches
# up to `agent \`, then re-inserts the `--server` and argument lines that are
# already present. Every run therefore appended another copy, restarted
# k3s-agent — which tears down every container on the node — and grew the unit
# without bound.
#
# Rendering the exact text the upstream template produces, right after it, makes
# the next upstream replace a no-op: the unit is already in the shape that role
# wants, so it reports no change and leaves k3s-agent alone. The trailing
# backslash and argument line must match that template character for character.
- name: Read the current k3s-agent unit
  ansible.builtin.slurp:
    src: "{{ systemd_dir }}/k3s-agent.service"
  register: k3s_agent_unit_raw
  vars:
    systemd_dir: "/etc/systemd/system"
  when: "'agent' in group_names"

- name: Build the canonical k3s-agent ExecStart
  ansible.builtin.set_fact:
    k3s_agent_execstart: "ExecStart=/usr/local/bin/k3s agent --server https://{{ api_endpoint }}:{{ api_port }}"
  when: "'agent' in group_names"

- name: Normalise the k3s-agent ExecStart block
  ansible.builtin.replace:
    path: "{{ systemd_dir }}/k3s-agent.service"
    regexp: '(?sm)^ExecStart=/usr/local/bin/k3s \\\n(    .*\n)*|^ExecStart=/usr/local/bin/k3s .*$'
    replace: "{{ k3s_agent_execstart }}"
  register: k3s_agent_unit_normalized
  vars:
    systemd_dir: "/etc/systemd/system"
  when: "'agent' in group_names"

- name: Restart k3s-agent only when the unit actually changed
  ansible.builtin.systemd:
    name: k3s-agent
    daemon_reload: true
    state: "{{ 'restarted' if k3s_agent_unit_normalized.changed else 'started' }}"
    enabled: true
  when: "'agent' in group_names"
