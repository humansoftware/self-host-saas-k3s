# Actual Harbor installation
- name: Add Harbor Helm repository
  kubernetes.core.helm_repository:
    name: harbor
    repo_url: https://helm.goharbor.io

- name: Install Harbor via Helm
  kubernetes.core.helm:
    name: harbor
    chart_ref: harbor/harbor
    release_namespace: "{{ harbor_namespace }}"
    create_namespace: true
    chart_version: "{{ harbor_version }}"
    values:
      expose:
        type: ingress
        ingress:
          hosts:
            core: "{{ harbor_domain }}"
        tls:
          enabled: "{{ harbor_use_tls | default(true) }}"
          certSource: "{{ harbor_tls_cert_source }}"
          secret:
            secretName: "{{ harbor_tls_secret_name }}"
      externalURL: "{{ harbor_external_url }}"
      harborAdminPassword: "{{ harbor_admin_password }}"
      persistence:
        enabled: true
        storageClass: "{{ harbor_storage_class }}"
        persistentVolumeClaim:
          registry:
            size: "{{ harbor_registry_size }}"
          database:
            size: "{{ harbor_database_size }}"
          redis:
            size: "{{ harbor_redis_size }}"
          trivy:
            size: "{{ harbor_trivy_size }}"
          jobservice:
            jobLog:
              size: "{{ harbor_jobservice_size }}"
    wait: true
    wait_timeout: "{{ helm_install_timeout }}"
  # The kubelet reapplies fsGroup (recursive chown/chmod adding group-write
  # + setgid) every time a Longhorn volume is remounted, even while the pod
  # is running. Postgres refuses a data directory with group-write
  # permissions, so a remount crashloops harbor-database and takes the whole
  # registry down ("Core service is not available"). The chart
  # (templates/database/database-ss.yaml) hardcodes the pod securityContext
  # and does not expose fsGroupChangePolicy, so we patch it here:
  # OnRootMismatch skips the recursive rewrite when the volume root already
  # matches fsGroup, which is the steady state for this PVC. Idempotent:
  # once applied, further runs change nothing and do not trigger a rolling
  # restart. Keeps the data-permissions-ensurer init container non-root.
- name: Keep Harbor database data-dir permissions stable across volume remounts
  kubernetes.core.k8s:
    state: patched
    kind: StatefulSet
    name: harbor-database
    namespace: "{{ harbor_namespace }}"
    definition:
      spec:
        template:
          spec:
            securityContext:
              fsGroupChangePolicy: OnRootMismatch
